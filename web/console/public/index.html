<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobranch</title>
  <!-- The Console's first screens: sign in, the welcome page (create, join, invitations), and an organization's home,
       members, roles and settings under its slug. The design system's colours (docs/cobranch/designs/design-system), the REST
       API at the URL config.json names, and the Auth server at the other URL it names. Caddy serves this page for
       every path, and it routes on the path: the organization's slug first, then its page. -->
  <style>
    :root {
      color-scheme: light;
      --color-bg-canvas: #ffffff;
      --color-bg-sunken: #f8f9fa;
      --color-bg-raised: #ffffff;
      --color-fg-default: #1a1d20;
      --color-fg-muted: #6b737b;
      --color-border-default: #e4e7ea;
      --color-accent: #2f6fed;
      --color-accent-fg: #ffffff;
      --color-status-success-fg: #0e6a3f;
      --color-status-success-bg: #ecfdf3;
      --color-status-success-border: #a6f0c4;
      --color-status-warning-fg: #8c500b;
      --color-status-warning-bg: #fff8eb;
      --color-status-warning-border: #fdd98a;
      --color-status-danger-fg: #a1262b;
      --color-status-danger-bg: #fff1f1;
      --color-status-danger-border: #f7b8bb;
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --color-bg-canvas: #131517;
        --color-bg-sunken: #0c0d0f;
        --color-bg-raised: #1b1e21;
        --color-fg-default: #f8f9fa;
        --color-fg-muted: #b4bcc2;
        --color-border-default: #2e3338;
        --color-accent: #6b9bff;
        --color-accent-fg: #0c0d0f;
        --color-status-success-fg: #6cdda0;
        --color-status-success-bg: #062a1b;
        --color-status-success-border: #105335;
        --color-status-warning-fg: #fcc04d;
        --color-status-warning-bg: #361c05;
        --color-status-warning-border: #723f0f;
        --color-status-danger-fg: #ff8a8e;
        --color-status-danger-bg: #3a0d0f;
        --color-status-danger-border: #7a2024;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg-canvas);
      color: var(--color-fg-default);
      font: 14px/20px var(--font-sans);
    }
    body.centered { display: grid; place-items: center; }
    h1 { margin: 0; font-size: 30px; line-height: 36px; letter-spacing: -0.6px; font-weight: 600; }
    h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
    h3 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: 0.4px; font-size: 12px; }
    p { margin: 0; color: var(--color-fg-muted); }
    a { color: var(--color-accent); }
    code { font-family: var(--font-mono); font-size: 13px; color: var(--color-fg-default); }
    [hidden] { display: none !important; }
    main.card {
      width: min(440px, calc(100vw - 32px));
      display: grid;
      gap: 16px;
      padding: 32px;
      border: 1px solid var(--color-border-default);
      border-radius: 12px;
      background: var(--color-bg-sunken);
    }
    .status {
      justify-self: start;
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--color-status-warning-border);
      background: var(--color-status-warning-bg);
      color: var(--color-status-warning-fg);
      font-size: 12px;
      line-height: 16px;
      font-weight: 500;
    }
    .status[data-state="ready"] {
      border-color: var(--color-status-success-border);
      background: var(--color-status-success-bg);
      color: var(--color-status-success-fg);
    }
    .buttons { display: grid; gap: 8px; }
    .button {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-raised);
      color: var(--color-fg-default);
      font: inherit;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .buttons .button { display: block; width: 100%; }
    .button.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-fg); }
    .button.danger { color: var(--color-status-danger-fg); border-color: var(--color-status-danger-border); }
    .button.small { padding: 3px 10px; font-size: 13px; }
    .button:disabled { opacity: 0.6; cursor: default; }
    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-status-danger-border);
      background: var(--color-status-danger-bg);
      color: var(--color-status-danger-fg);
    }
    .notice {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--color-status-success-border);
      background: var(--color-status-success-bg);
      color: var(--color-status-success-fg);
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .demo { padding-top: 12px; border-top: 1px solid var(--color-border-default); display: grid; gap: 8px; }
    form { display: grid; gap: 10px; }
    form.inline { grid-template-columns: 1fr auto; align-items: end; }
    form.inline.with-role { grid-template-columns: 1fr auto auto; }
    label { display: grid; gap: 4px; font-weight: 500; }
    label span { color: var(--color-fg-muted); font-weight: 400; font-size: 12px; }
    label.check { grid-template-columns: auto 1fr; align-items: center; gap: 8px; }
    input, select {
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--color-border-default);
      background: var(--color-bg-raised);
      color: var(--color-fg-default);
      font: inherit;
      width: 100%;
    }
    header.bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      border-bottom: 1px solid var(--color-border-default);
      background: var(--color-bg-sunken);
      flex-wrap: wrap;
    }
    header.bar .brand { font-weight: 600; letter-spacing: -0.2px; text-decoration: none; color: var(--color-fg-default); }
    header.bar select { width: auto; }
    header.bar nav { display: flex; gap: 4px; }
    header.bar nav a { padding: 5px 10px; border-radius: 8px; color: var(--color-fg-muted); text-decoration: none; font-weight: 500; }
    header.bar nav a.current { background: var(--color-bg-raised); color: var(--color-fg-default); border: 1px solid var(--color-border-default); }
    header.bar .spacer { flex: 1; }
    main.page { width: min(880px, 100%); margin: 0 auto; padding: 24px; display: grid; gap: 24px; }
    section.panel { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--color-border-default); border-radius: 12px; background: var(--color-bg-sunken); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--color-border-default); vertical-align: middle; }
    th { color: var(--color-fg-muted); font-weight: 500; font-size: 12px; }
    td.actions { text-align: right; white-space: nowrap; }
    .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--color-border-default); background: var(--color-bg-raised); font-size: 12px; margin-right: 4px; }
    .perms { display: flex; flex-wrap: wrap; gap: 4px; }
    .perms code { font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--color-bg-raised); border: 1px solid var(--color-border-default); }
    .chip button { all: unset; cursor: pointer; margin-left: 4px; color: var(--color-fg-muted); }
    .chip button:hover { color: var(--color-status-danger-fg); }
    .grant { display: inline-flex; gap: 4px; align-items: center; margin-top: 4px; }
    .grant select { padding: 2px 6px; font-size: 13px; }
    .picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 12px; }
    .picks label { display: flex; gap: 6px; align-items: center; font-weight: 400; font-size: 13px; }
    .picks label code { font-size: 12px; }
    .picks input { width: auto; }
  </style>
</head>
<body class="centered">
  <div id="app"></div>
  <script>
    // The Console's root, wherever the operator mounts it (its route strips the prefix): the path of the Console's URL,
    // which config.json names, and which every directory serves. Every page's path is relative to it; the Auth
    // server sends a failed sign-in back to /sign-in.
    let base = "/";
    const byId = (id) => document.getElementById(id);
    const app = byId("app");
    // What a failed sign-in's error code means, by the code the Auth server sent us back with.
    const signInErrors = {
      provider: "The identity provider didn't sign you in. Try again.",
      flow: "The sign-in took too long, or began in another browser. Try again.",
      refused: "This installation doesn't let you sign up. Ask its operator for an invitation.",
      email_taken: "Another account already holds your email, through a different identity provider. Sign in with that one.",
      unknown_provider: "That identity provider isn't set up here.",
      internal: "Something went wrong on our side. Try again in a moment.",
    };
    // The Console's own paths, which no organization's slug is.
    const reserved = ["sign-in", "new", "join", "invitations", "me", "settings"];
    let config = { restUrl: "", authUrl: "" };
    let me = null;
    let orgs = [];
    let roles = []; // the roles the organization shown grants
    let permissions = []; // what a role at an organization may hold

    // api calls the REST API with the session cookie, and rejects with the problem it answered.
    async function api(method, path, body) {
      const options = { method, credentials: "include", headers: { Accept: "application/json" } };
      if (body !== undefined) {
        options.headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(body);
      }
      const r = await fetch(config.restUrl + "/v1" + path, options);
      if (r.status === 204) return null;
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(data.detail || data.title || r.statusText), { status: r.status, code: data.code });
      return data;
    }
    const h = (tag, attrs = {}, ...children) => {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") el.className = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else if (k === "hidden" || k === "disabled" || k === "checked" || k === "selected") el[k] = v;
        else if (v !== undefined && v !== null) el.setAttribute(k, v);
      }
      el.append(...children.flat(Infinity).filter((c) => c !== null && c !== undefined && c !== false));
      return el;
    };
    const when = (at) => new Date(at).toLocaleDateString(undefined, { dateStyle: "medium" });
    // go navigates within the Console; render draws the page for the path.
    function go(path, replace) {
      history[replace ? "replaceState" : "pushState"](null, "", base + path.replace(/^\//, ""));
      render();
    }
    // route is the page's path under the Console's root: [] for its home, [slug] or [slug, page] for an organization's.
    function route() {
      const rest = location.pathname.slice(base.length).replace(/\/$/, "");
      return rest ? rest.split("/") : [];
    }
    window.addEventListener("popstate", render);
    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-nav]");
      if (a && !e.metaKey && !e.ctrlKey) {
        e.preventDefault();
        go(a.getAttribute("href").slice(base.length - 1));
      }
    });

    // The first load: where the APIs are, the version, and who the viewer is.
    // config.json sits beside the page's directory: for the Console's root without a trailing slash too.
    fetch(new URL("config.json", location.origin + location.pathname.replace(/\/?$/, "/"))).then((r) => r.json()).then(async (c) => {
      config = { restUrl: c.restUrl || "", authUrl: c.authUrl || "" };
      if (c.consoleUrl) base = new URL(c.consoleUrl).pathname.replace(/\/?$/, "/");
      try {
        me = await api("GET", "/me");
        [orgs, permissions] = await Promise.all([api("GET", "/me/organizations").then((d) => d.organizations), api("GET", "/permissions?scope=organization").then((d) => d.permissions)]);
      } catch (err) {
        if (err.status !== 401) throw err;
      }
      render();
    }).catch(() => showCard(h("span", { class: "status" }, "REST API unreachable"), h("p", {}, "The Console couldn't reach this installation's REST API. Try again in a moment.")));

    function showCard(...children) {
      document.body.className = "centered";
      app.replaceChildren(h("main", { class: "card" }, h("h1", {}, "Cobranch"), ...children));
    }

    function render() {
      const parts = route();
      if (!me) return showSignIn();
      if (parts.length === 0) {
        const remembered = (() => { try { return localStorage.getItem("cobranch.org"); } catch { return null; } })();
        const first = orgs.find((o) => o.slug === remembered) || orgs[0];
        if (first) return go("/" + first.slug, true);
        return showWelcome();
      }
      if (parts[0] === "new") return showWelcome();
      if (reserved.includes(parts[0])) return showWelcome();
      return showOrganization(parts[0], parts[1] || "");
    }

    async function showSignIn() {
      const card = [];
      const params = new URLSearchParams(location.search);
      const code = params.get("error");
      if (code) card.push(h("p", { class: "alert" }, signInErrors[code] || signInErrors.internal));
      if (!config.authUrl) {
        return showCard(h("h2", {}, "Sign in"), ...card, h("p", {}, "Sign-in isn't set up yet: this installation lists no identity provider. Its operator adds one to the chart's ", h("code", {}, "auth.providers"), "."));
      }
      try {
        const { providers, seeded } = await (await fetch(config.authUrl + "/providers", { headers: { Accept: "application/json" } })).json();
        if (providers.length === 0 && seeded.length === 0) card.push(h("p", {}, "Sign-in isn't set up yet: this installation lists no identity provider."));
        card.push(h("div", { class: "buttons" }, providers.map((p) => h("a", { class: "button primary", href: config.authUrl + "/sign-in?" + new URLSearchParams({ provider: p.id, return: "/" }) }, "Sign in with " + p.name))));
        if (seeded.length) {
          card.push(h("div", { class: "demo" }, h("p", {}, "Demo data is on: sign in as one of its users."),
            h("div", { class: "buttons" }, seeded.map((u) => h("a", { class: "button", href: config.authUrl + "/sign-in?" + new URLSearchParams({ user: u.subject, return: "/" }) }, u.displayName + " (" + u.subject + ")")))));
        }
      } catch {
        card.push(h("p", {}, "Sign-in isn't answering. Try again in a moment."));
      }
      showCard(h("h2", {}, "Sign in"), ...card);
    }

    function signOut() {
      fetch(config.authUrl + "/sign-out", { method: "POST", credentials: "include" }).finally(() => location.replace(base));
    }

    // The welcome page: a user who belongs nowhere creates, asks to join, or accepts an invitation. It is also /new.
    async function showWelcome() {
      const [invitations, requests] = await Promise.all([api("GET", "/me/invitations").then((d) => d.invitations), api("GET", "/me/join-requests").then((d) => d.joinRequests)]);
      const error = h("p", { class: "alert", hidden: true });
      const fail = (err) => { error.textContent = err.message; error.hidden = false; };
      const sections = [h("div", { class: "row" }, h("h2", {}, "Welcome, " + me.displayName), h("button", { class: "button small", type: "button", onclick: signOut }, "Sign out")), error];
      if (orgs.length) sections.push(h("p", {}, "You belong to ", orgs.map((o, i) => [i ? ", " : "", h("a", { href: base + o.slug, "data-nav": "" }, o.name)]), "."));
      if (invitations.length) {
        sections.push(h("section", { class: "panel" }, h("h3", {}, "Invitations"), ...invitations.map((inv) => h("div", { class: "row" },
          h("div", {}, h("strong", {}, inv.orgName), h("p", {}, "as " + (inv.roleName || "a member") + ", to " + inv.email + ", until " + when(inv.expiresAt))),
          h("div", {}, h("button", { class: "button small primary", type: "button", onclick: () => api("POST", "/me/invitations/" + inv.id + "/accept").then(reloadTo).catch(fail) }, "Accept"), " ",
            h("button", { class: "button small", type: "button", onclick: () => api("POST", "/me/invitations/" + inv.id + "/decline").then(() => showWelcome()).catch(fail) }, "Decline"))))));
      }
      if (me.permissions.includes("orgs.create")) {
        const slug = h("input", { name: "slug", required: true, placeholder: "acme", pattern: "[a-z0-9]+(-[a-z0-9]+)*", minlength: 2, maxlength: 39 });
        const name = h("input", { name: "name", required: true, placeholder: "Acme" });
        sections.push(h("section", { class: "panel" }, h("h3", {}, "Create an organization"),
          h("form", { onsubmit: (e) => { e.preventDefault(); api("POST", "/orgs", { slug: slug.value, name: name.value }).then(reloadTo).catch(fail); } },
            h("label", {}, "Name", name), h("label", {}, "Slug", h("span", {}, "Its URL: 2 to 39 lowercase letters, digits and hyphens."), slug),
            h("div", {}, h("button", { class: "button primary", type: "submit" }, "Create")))));
      }
      const joinSlug = h("input", { name: "slug", required: true, placeholder: "acme" });
      const note = h("input", { name: "note", placeholder: "A word for its managers (optional)", maxlength: 500 });
      sections.push(h("section", { class: "panel" }, h("h3", {}, "Ask to join"),
        h("form", { onsubmit: (e) => { e.preventDefault(); api("POST", "/orgs/" + encodeURIComponent(joinSlug.value) + "/join-requests", { note: note.value }).then(() => showWelcome()).catch(fail); } },
          h("label", {}, "Organization slug", joinSlug), h("label", {}, "Note", note), h("div", {}, h("button", { class: "button", type: "submit" }, "Ask to join"))),
        requests.length ? h("p", {}, "Waiting: ", requests.map((r, i) => [i ? ", " : "", h("strong", {}, r.orgName)]), ".") : null));
      document.body.className = "centered";
      app.replaceChildren(h("main", { class: "card" }, h("h1", {}, "Cobranch"), ...sections));
    }

    // reloadTo reloads the viewer's organizations and opens org.
    async function reloadTo(org) {
      orgs = (await api("GET", "/me/organizations")).organizations;
      go("/" + org.slug);
    }
    const roleSelect = (selected) => h("select", { name: "roleId" }, roles.map((r) => h("option", { value: r.id, selected: r.id === selected }, r.name)));

    // An organization's pages: its home, members and settings, under a bar with the switcher and the navigation.
    async function showOrganization(slug, page) {
      let org;
      try {
        org = await api("GET", "/orgs/" + encodeURIComponent(slug));
      } catch (err) {
        if (err.status === 404) return notFound(slug);
        throw err;
      }
      if (org.slug !== slug) return go("/" + org.slug + (page ? "/" + page : ""), true);
      try { localStorage.setItem("cobranch.org", org.slug); } catch { /* a convenience */ }
      roles = (await api("GET", "/orgs/" + org.slug + "/roles")).roles;
      const can = (p) => org.viewerPermissions.includes(p);
      const pages = [["", "Home"], ["members", "Members"], ["roles", "Roles"]];
      if (can("org.manage")) pages.push(["settings", "Settings"]);
      const link = ([p, label]) => h("a", { href: base + org.slug + (p ? "/" + p : ""), "data-nav": "", class: p === page ? "current" : "" }, label);
      const switcher = h("select", { onchange: (e) => (e.target.value === "+" ? go("/new") : go("/" + e.target.value)) },
        orgs.map((o) => h("option", { value: o.slug, selected: o.slug === org.slug }, o.name)), h("option", { value: "+" }, "Create or join…"));
      const bar = h("header", { class: "bar" }, h("a", { class: "brand", href: base, "data-nav": "" }, "Cobranch"), switcher, h("nav", {}, pages.map(link)),
        h("span", { class: "spacer" }), h("span", {}, me.displayName), h("button", { class: "button small", type: "button", onclick: signOut }, "Sign out"));
      const main = h("main", { class: "page" });
      document.body.className = "";
      app.replaceChildren(bar, main);
      if (page === "members") return showMembers(org, main, can);
      if (page === "roles") return showRoles(org, main, can);
      if (page === "settings" && can("org.manage")) return showSettings(org, main);
      if (page) return go("/" + org.slug);
      main.append(h("h1", {}, org.name), h("p", {}, h("code", {}, org.slug), org.acceptsJoinRequests ? " · accepts join requests" : ""),
        h("section", { class: "panel" }, h("h3", {}, "What you may do here"), h("div", { class: "perms" }, org.viewerPermissions.map((p) => h("code", {}, p)))),
        h("section", { class: "panel" }, h("h3", {}, "Next"), h("p", {}, "Repositories, agents and the rest arrive with their slices. For now, manage ", h("a", { href: base + org.slug + "/members", "data-nav": "" }, "its members"), " and ", h("a", { href: base + org.slug + "/roles", "data-nav": "" }, "its roles"), ".")));
    }

    function notFound(slug) {
      showCard(h("h2", {}, "No such organization"), h("p", {}, "There is no organization ", h("code", {}, slug), " that you may see."), h("a", { class: "button", href: base, "data-nav": "" }, "Back"));
    }

    async function showMembers(org, main, can) {
      const manage = can("org.members.manage");
      const grants = can("org.grants.manage");
      const error = h("p", { class: "alert", hidden: true });
      const fail = (err) => { error.textContent = err.message; error.hidden = false; };
      const refresh = () => showMembers(org, main, can);
      // A member's roles: with org.grants.manage, each revocable, and the roles they lack grantable.
      const rolesOf = (m) => {
        const held = m.roles.map((r) => h("span", { class: "chip" }, r.name, grants
          ? h("button", { type: "button", title: "Revoke " + r.name, onclick: () => api("DELETE", "/orgs/" + org.slug + "/members/" + m.userId + "/roles/" + r.id).then(refresh).catch(fail) }, "×") : null));
        const missing = roles.filter((r) => !m.roles.some((held) => held.id === r.id));
        if (!grants || !missing.length) return held;
        const pick = h("select", {}, missing.map((r) => h("option", { value: r.id }, r.name)));
        return [held, h("span", { class: "grant" }, pick, h("button", { class: "button small", type: "button", onclick: () => api("POST", "/orgs/" + org.slug + "/members/" + m.userId + "/roles", { roleId: pick.value }).then(refresh).catch(fail) }, "Grant"))];
      };
      const [members, invitations, requests] = await Promise.all([
        api("GET", "/orgs/" + org.slug + "/members").then((d) => d.members),
        manage ? api("GET", "/orgs/" + org.slug + "/invitations").then((d) => d.invitations) : [],
        manage ? api("GET", "/orgs/" + org.slug + "/join-requests").then((d) => d.joinRequests) : [],
      ]);
      const memberRow = (m) => h("tr", {}, h("td", {}, m.displayName, m.userId === me.id ? h("span", { class: "chip" }, "you") : null),
        h("td", {}, rolesOf(m)), h("td", {}, when(m.joinedAt)),
        h("td", { class: "actions" }, m.userId === me.id
          ? h("button", { class: "button small danger", type: "button", onclick: () => api("POST", "/orgs/" + org.slug + "/leave").then(() => location.replace(base)).catch(fail) }, "Leave")
          : manage ? h("button", { class: "button small danger", type: "button", onclick: () => api("DELETE", "/orgs/" + org.slug + "/members/" + m.userId).then(refresh).catch(fail) }, "Remove") : null));
      const sections = [h("h1", {}, "Members"), error,
        h("section", { class: "panel" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Member"), h("th", {}, "Roles"), h("th", {}, "Joined"), h("th", {}))), h("tbody", {}, members.map(memberRow))))];
      if (manage) {
        const email = h("input", { name: "email", type: "email", required: true, placeholder: "pat@example.com" });
        const role = roleSelect(org.membershipRoleId);
        const inviteLink = (inv) => location.origin + base + "invitations#" + inv.id;
        sections.push(h("section", { class: "panel" }, h("h3", {}, "Invitations"),
          h("form", { class: "inline with-role", onsubmit: (e) => { e.preventDefault(); api("POST", "/orgs/" + org.slug + "/invitations", { email: email.value, roleId: role.value }).then(refresh).catch(fail); } },
            h("label", {}, "Email", email), h("label", {}, "Role", role), h("button", { class: "button primary", type: "submit" }, "Invite")),
          invitations.length ? h("table", {}, h("tbody", {}, invitations.map((inv) => h("tr", {}, h("td", {}, inv.email), h("td", {}, h("span", { class: "chip" }, inv.roleName || "?")), h("td", {}, "until " + when(inv.expiresAt)),
            h("td", { class: "actions" }, h("button", { class: "button small", type: "button", onclick: (e) => navigator.clipboard.writeText(inviteLink(inv)).then(() => { e.target.textContent = "Copied"; }).catch(() => {}) }, "Copy link"), " ",
              h("button", { class: "button small danger", type: "button", onclick: () => api("DELETE", "/orgs/" + org.slug + "/invitations/" + inv.id).then(refresh).catch(fail) }, "Cancel")))))) : h("p", {}, "No pending invitations. An invitee signs in with the email you invite, and accepts it on their welcome page.")));
        sections.push(h("section", { class: "panel" }, h("h3", {}, "Join requests"),
          requests.length ? h("table", {}, h("tbody", {}, requests.map((r) => {
            const role = roleSelect(org.membershipRoleId);
            return h("tr", {}, h("td", {}, r.userName, r.note ? h("p", {}, r.note) : null), h("td", {}, role), h("td", {}, "until " + when(r.expiresAt)),
              h("td", { class: "actions" }, h("button", { class: "button small primary", type: "button", onclick: () => api("POST", "/orgs/" + org.slug + "/join-requests/" + r.id + "/approve", { roleId: role.value }).then(refresh).catch(fail) }, "Approve"), " ",
                h("button", { class: "button small", type: "button", onclick: () => api("POST", "/orgs/" + org.slug + "/join-requests/" + r.id + "/decline").then(refresh).catch(fail) }, "Decline")));
          }))) : h("p", {}, org.acceptsJoinRequests ? "Nobody is asking to join." : "This organization doesn't accept join requests; its settings turn them on.")));
      }
      main.replaceChildren(...sections);
    }

    // The roles page: what each role holds, and, with org.grants.manage, the organization's own roles to define,
    // change and delete.
    function showRoles(org, main, can) {
      const manage = can("org.grants.manage");
      const error = h("p", { class: "alert", hidden: true });
      const fail = (err) => { error.textContent = err.message; error.hidden = false; };
      const refresh = () => api("GET", "/orgs/" + org.slug + "/roles").then((d) => { roles = d.roles; showRoles(org, main, can); }).catch(fail);
      // roleForm edits a role's definition, a new one when role is null, and saves it through save.
      const roleForm = (role, save, cancel) => {
        const name = h("input", { name: "name", required: true, maxlength: 50, value: role ? role.name : "", placeholder: "Release manager" });
        const description = h("input", { name: "description", maxlength: 500, value: role ? role.description : "" });
        const picks = permissions.map((p) => h("label", {}, h("input", { type: "checkbox", value: p, checked: !!role && role.permissions.includes(p) }), h("code", {}, p)));
        return h("form", { onsubmit: (e) => {
          e.preventDefault();
          const chosen = picks.map((l) => l.firstChild).filter((c) => c.checked).map((c) => c.value);
          save({ name: name.value, description: description.value, permissions: chosen }).then(refresh).catch(fail);
        } },
          h("label", {}, "Name", name), h("label", {}, "Description", description),
          h("label", {}, "Permissions", h("span", {}, "Only what you hold here yourself."), h("div", { class: "picks" }, picks)),
          h("div", {}, h("button", { class: "button primary", type: "submit" }, role ? "Save" : "Define"), " ", cancel ? h("button", { class: "button", type: "button", onclick: cancel }, "Cancel") : null));
      };
      const rows = h("tbody", {});
      const roleRow = (r) => {
        const row = h("tr", {}, h("td", {}, r.name, r.builtIn ? h("span", { class: "chip" }, "built in") : null, r.description ? h("p", {}, r.description) : null),
          h("td", {}, h("div", { class: "perms" }, r.permissions.map((p) => h("code", {}, p)))),
          h("td", { class: "actions" }, manage && !r.builtIn ? [
            h("button", { class: "button small", type: "button", onclick: () => {
              const editor = h("tr", {}, h("td", { colspan: 3 }, roleForm(r, (body) => api("PATCH", "/orgs/" + org.slug + "/roles/" + r.id, body), () => editor.replaceWith(row))));
              row.replaceWith(editor);
            } }, "Edit"), " ",
            h("button", { class: "button small danger", type: "button", onclick: () => api("DELETE", "/orgs/" + org.slug + "/roles/" + r.id).then(refresh).catch(fail) }, "Delete"),
          ] : null));
        return row;
      };
      rows.append(...roles.map(roleRow));
      const sections = [h("h1", {}, "Roles"), error,
        h("section", { class: "panel" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Role"), h("th", {}, "Permissions"), h("th", {}))), rows))];
      if (manage) sections.push(h("section", { class: "panel" }, h("h3", {}, "Define a role"), h("p", {}, "A role of this organization alone, to grant beside the built-in ones. Changing it changes every grant of it."),
        roleForm(null, (body) => api("POST", "/orgs/" + org.slug + "/roles", body), null)));
      main.replaceChildren(...sections);
    }

    async function showSettings(org, main) {
      const error = h("p", { class: "alert", hidden: true });
      const saved = h("p", { class: "notice", hidden: true }, "Saved.");
      const name = h("input", { name: "name", required: true, value: org.name });
      const slug = h("input", { name: "slug", required: true, value: org.slug, pattern: "[a-z0-9]+(-[a-z0-9]+)*", minlength: 2, maxlength: 39 });
      const role = roleSelect(org.membershipRoleId);
      const accepts = h("input", { name: "acceptsJoinRequests", type: "checkbox", checked: org.acceptsJoinRequests });
      const providers = h("input", { name: "providers", value: (org.providers || []).join(", "), placeholder: "All of this installation's" });
      const form = h("form", { onsubmit: async (e) => {
        e.preventDefault();
        error.hidden = saved.hidden = true;
        const list = providers.value.split(",").map((s) => s.trim()).filter(Boolean);
        try {
          const updated = await api("PATCH", "/orgs/" + org.slug, { name: name.value, slug: slug.value, membershipRoleId: role.value, acceptsJoinRequests: accepts.checked, providers: list });
          orgs = (await api("GET", "/me/organizations")).organizations;
          if (updated.slug !== org.slug) return go("/" + updated.slug + "/settings");
          saved.hidden = false;
          org = updated;
        } catch (err) {
          error.textContent = err.message;
          error.hidden = false;
        }
      } },
        h("label", {}, "Name", name),
        h("label", {}, "Slug", h("span", {}, "Its URL. The old slug keeps pointing here after a change."), slug),
        h("label", {}, "Membership role", h("span", {}, "The role everyone who joins gets."), role),
        h("label", { class: "check" }, accepts, "Accept join requests by slug"),
        h("label", {}, "Identity providers", h("span", {}, "The providers members may sign in with, by ID, comma-separated; empty for all of this installation's."), providers),
        h("div", {}, h("button", { class: "button primary", type: "submit" }, "Save")));
      main.replaceChildren(h("h1", {}, "Settings"), error, saved, h("section", { class: "panel" }, form));
    }
  </script>
</body>
