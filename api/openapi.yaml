# Cobranch's REST contract, written first: internal/adapters/rest generates its server from it, and the SDKs will be
# generated from it too (https://github.com/arikkfir-org/cobranch/blob/main/docs/cobranch/designs/architecture.md, "API conventions").
openapi: 3.1.0
info:
  title: Cobranch API
  version: v1
  description: The REST surface of Cobranch, the surface of its SDKs.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /v1
paths:
  /version:
    get:
      operationId: getVersion
      summary: The version of Cobranch that serves this installation.
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Who the request's credential signs in.
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: The user's live sessions, newest first.
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/sessions/{id}:
    delete:
      operationId: revokeMySession
      summary: Revokes one of the user's sessions; the next request with its cookie fails.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/organizations:
    get:
      operationId: listMyOrganizations
      summary: The organizations the user belongs to, by name.
      responses:
        "200":
          description: The organizations.
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations:
    get:
      operationId: listMyInvitations
      summary: The invitations waiting for the user's verified emails, oldest first.
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations/{id}/accept:
    post:
      operationId: acceptInvitation
      summary: Joins the organization through an invitation to one of the user's verified emails.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The organization joined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/invitations/{id}/decline:
    post:
      operationId: declineInvitation
      summary: Declines an invitation to one of the user's verified emails.
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/join-requests:
    get:
      operationId: listMyJoinRequests
      summary: The user's requests to join organizations that still wait, oldest first.
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [joinRequests]
                properties:
                  joinRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /roles:
    get:
      operationId: listBuiltInRoles
      deprecated: true
      summary: The built-in roles granted at a scope. Deprecated, since roles are an organization's; the organization's roles list them all.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [organization]
      responses:
        "200":
          description: The built-in roles, with the route's end announced.
          headers:
            Deprecation:
              description: When the route was deprecated, as RFC 9745 says.
              schema:
                type: string
            Sunset:
              description: When the route goes, as RFC 8594 says.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /permissions:
    get:
      operationId: listPermissions
      summary: The permissions a role granted at a scope may hold, from the catalog.
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [organization]
      responses:
        "200":
          description: The permissions.
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs:
    post:
      operationId: createOrganization
      summary: Creates an organization, with the user its first Owner; takes orgs.create.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  description: 2 to 39 lowercase letters, digits and single hyphens, unique among organizations and their old slugs.
                name:
                  type: string
      responses:
        "201":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}:
    get:
      operationId: getOrganization
      summary: An organization by its slug, or an old slug of its; takes org.read, and otherwise answers 404.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The organization, with its current slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrganization
      summary: Changes an organization's name, slug or settings; takes org.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSettings"
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/leave:
    post:
      operationId: leaveOrganization
      summary: Leaves the organization, dropping every role held there; its last Owner can't.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "204":
          description: Left.
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members:
    get:
      operationId: listMembers
      summary: The organization's members with the roles they hold there; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}:
    delete:
      operationId: removeMember
      summary: Removes a member, with every role they hold; takes org.members.manage and every permission of those roles.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}/roles:
    post:
      operationId: grantRole
      summary: Gives a member a role; takes org.grants.manage and every permission of the role.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
                  format: uuid
      responses:
        "204":
          description: Granted.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/members/{user}/roles/{role}:
    delete:
      operationId: revokeRole
      summary: Takes a role from a member; takes org.grants.manage and every permission of the role. The last Owner keeps Owner.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/user"
        - $ref: "#/components/parameters/role"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/roles:
    get:
      operationId: listRoles
      summary: The roles the organization grants, the built-in ones first, then its own; takes org.read.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The roles.
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createRole
      summary: Defines a custom role; takes org.grants.manage and every permission it lists.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/roles/{role}:
    patch:
      operationId: updateRole
      summary: Redefines a custom role, and with it every grant of it; takes org.grants.manage and every permission it listed or lists.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/role"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChanges"
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteRole
      summary: Deletes a custom role nobody holds, cancelling the invitations that offered it; takes org.grants.manage and every permission of the role.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/role"
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/invitations:
    get:
      operationId: listInvitations
      summary: The organization's invitations that wait, oldest first; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: invite
      summary: Invites an email; takes org.members.manage, and a role other than the membership role adds the grant rules.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                roleId:
                  type: string
                  format: uuid
                  description: The role the invitee gets; the organization's membership role when left out.
      responses:
        "201":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/invitations/{id}:
    delete:
      operationId: cancelInvitation
      summary: Cancels an invitation that waits; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Cancelled.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/join-requests:
    get:
      operationId: listJoinRequests
      summary: The requests to join the organization that wait, oldest first; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
      responses:
        "200":
          description: The requests.
          content:
            application/json:
              schema:
                type: object
                required: [joinRequests]
                properties:
                  joinRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/JoinRequest"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: requestToJoin
      summary: Asks to join the organization the slug names; one that takes no requests answers 404 like one that doesn't exist.
      parameters:
        - $ref: "#/components/parameters/org"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  description: A word for the managers, at most 500 characters.
      responses:
        "201":
          description: The request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRequest"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/join-requests/{id}/approve:
    post:
      operationId: approveJoinRequest
      summary: Makes the requester a member; takes org.members.manage, and a role other than the membership role adds the grant rules.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId:
                  type: string
                  format: uuid
                  description: The role the requester gets; the organization's membership role when left out.
      responses:
        "204":
          description: Approved.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /orgs/{org}/join-requests/{id}/decline:
    post:
      operationId: declineJoinRequest
      summary: Declines a request that waits; takes org.members.manage.
      parameters:
        - $ref: "#/components/parameters/org"
        - $ref: "#/components/parameters/id"
      responses:
        "204":
          description: Declined.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    org:
      name: org
      in: path
      required: true
      description: The organization's slug, or an old slug of its.
      schema:
        type: string
    user:
      name: user
      in: path
      required: true
      description: A member's user ID.
      x-go-name: UserID
      schema:
        type: string
        format: uuid
    role:
      name: role
      in: path
      required: true
      x-go-name: RoleID
      schema:
        type: string
        format: uuid
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: An error, as problem details (RFC 9457).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: The version the server was built as, a release version or a commit's short SHA.
          examples: [v0.1.0, 1e76e84]
    User:
      type: object
      description: A person, a principal of kind user.
      required: [id, displayName, emails, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        emails:
          type: array
          description: The emails the user holds; the sign-up's verified one today, several later.
          items:
            $ref: "#/components/schemas/Email"
        permissions:
          type: array
          description: The permissions the user holds at the installation, such as orgs.create.
          items:
            type: string
    Email:
      type: object
      required: [email, verified]
      properties:
        email:
          type: string
        verified:
          type: boolean
    Session:
      type: object
      description: A signed-in browser.
      required: [id, createdAt, lastSeenAt, expiresAt, userAgent, ip, current]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the session ends however it is used.
        userAgent:
          type: string
        ip:
          type: string
        current:
          type: boolean
          description: Whether this is the session the request itself came with.
    Organization:
      type: object
      description: An organization, with what the viewer may do there.
      required: [id, slug, name, membershipRoleId, acceptsJoinRequests, createdAt, viewerPermissions]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: The current slug; a request by an old one gets the organization with this one.
        name:
          type: string
        membershipRoleId:
          type: string
          format: uuid
          description: The role everyone who joins gets.
        acceptsJoinRequests:
          type: boolean
        providers:
          type: array
          description: The identity providers its members may sign in with; absent, all of the installation's.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        viewerPermissions:
          type: array
          description: The permissions the viewer holds at the organization.
          items:
            type: string
    OrganizationSettings:
      type: object
      description: What a manager changes; a field left out keeps its value.
      properties:
        slug:
          type: string
        name:
          type: string
        membershipRoleId:
          type: string
          format: uuid
        acceptsJoinRequests:
          type: boolean
        providers:
          type: array
          description: The identity providers members may sign in with, by ID. Empty, all of the installation's; left out or null, as before.
          items:
            type: string
    Role:
      type: object
      description: A role granted at the organization, built in or its own.
      required: [id, name, description, permissions, builtIn]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        builtIn:
          type: boolean
        orgId:
          type: string
          format: uuid
          description: The organization a custom role belongs to; absent on a built-in role.
    RoleInput:
      type: object
      description: A custom role's definition.
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: From the permissions listed at scope organization; at least one.
          items:
            type: string
    RoleChanges:
      type: object
      description: What changes about a custom role; a field left out keeps its value.
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      description: A user who belongs to the organization, with the roles they hold there.
      required: [userId, displayName, joinedAt, roles]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    Invitation:
      type: object
      description: An invitation to an email, which only a user holding it, verified, accepts.
      required: [id, orgId, orgSlug, orgName, email, roleId, roleName, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgSlug:
          type: string
        orgName:
          type: string
        email:
          type: string
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
          description: The role's name; empty once a custom role it offered is gone.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    JoinRequest:
      type: object
      description: A user's request to join an organization, waiting for a member manager.
      required: [id, orgId, orgSlug, orgName, userId, userName, note, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        orgSlug:
          type: string
        orgName:
          type: string
        userId:
          type: string
          format: uuid
        userName:
          type: string
        note:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    Problem:
      type: object
      description: Problem details (RFC 9457), with Cobranch's stable error code and the request's ID.
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          description: A URI that names the problem's type; "about:blank" when the status says it all.
        title:
          type: string
          description: A short summary of the problem's type.
        status:
          type: integer
          description: The HTTP status code.
        detail:
          type: string
          description: What went wrong with this request.
        code:
          type: string
          description: The stable error code, such as route.not_found.
        requestId:
          type: string
          description: The request's ID, which the response's X-Request-Id header names too.
